# Cache path for Next.js static assets
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=7d use_temp_path=off;

server {
    listen 443 ssl http2;
    server_name rootsroutesrealtalk.com www.rootsroutesrealtalk.com;

    # SSL Config (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/rootsroutesrealtalk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rootsroutesrealtalk.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Allow large file uploads (100MB - increase if needed)
    client_max_body_size 100M;

    # Optimization: Buffer sizes for better performance with large files
    proxy_buffer_size          256k;
    proxy_buffers              8 256k;
    proxy_busy_buffers_size    512k;

    # Extended timeout settings for large file uploads
    proxy_connect_timeout       300s;
    proxy_send_timeout          300s;
    proxy_read_timeout          300s;

    # Root location: Send everything to Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Essential Headers for Client IP detection
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optimization: Cache Next.js Static Files
    location /_next/static {
        proxy_cache STATIC;
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name rootsroutesrealtalk.com www.rootsroutesrealtalk.com;
    return 301 https://$host$request_uri;
}



